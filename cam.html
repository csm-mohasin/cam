<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Cam - Sender</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #050810;
    color: #d7f9ff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }
  h1 { color: #00f0ff; text-shadow: 0 0 12px #00f0ff88; font-size: 20px; margin-bottom: 16px; }
  #status {
    padding: 10px 18px;
    border-radius: 20px;
    background: #1a1f2e;
    border: 1px solid #ff3366;
    color: #ff3366;
    font-size: 14px;
    margin-bottom: 20px;
  }
  #status.live { border-color: #00ff9d; color: #00ff9d; box-shadow: 0 0 15px #00ff9d55; }
  button {
    background: linear-gradient(135deg, #00f0ff, #0080ff);
    border: none;
    color: #000;
    font-weight: bold;
    padding: 14px 30px;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    margin: 6px;
  }
  #pulse {
    width: 14px; height: 14px; border-radius: 50%;
    background: #00ff9d; display: inline-block; margin-right: 8px;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  #localVideo { display: none; } /* actual streaming video — user er dekhar dorkar nai */

  #scanBox {
    position: relative;
    width: 100%;
    max-width: 320px;
    display: none;
  }
  #scanVideo {
    width: 100%;
    border-radius: 14px;
    border: 1px solid #1e2a3a;
    box-shadow: 0 0 30px #00f0ff22;
  }
  #scanFrame {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 65%;
    aspect-ratio: 1;
    border: 2px solid #00f0ff;
    border-radius: 12px;
    box-shadow: 0 0 20px #00f0ffaa;
    pointer-events: none;
  }
</style>
</head>
<body>
<h1>📡 LIVE CAM SENDER</h1>
<div id="status">Room e connect koro</div>

<div id="entryButtons">
  <button id="scanBtn" onclick="startScan()">📷 QR Scan Kore Connect</button>
  <button id="startBtn" onclick="start()" style="display:none">Start Streaming</button>
</div>

<div id="scanBox">
  <video id="scanVideo" autoplay playsinline muted></video>
  <div id="scanFrame"></div>
</div>

<video id="localVideo" autoplay playsinline muted></video>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCMYXu9BH7nUgi3IFQX_qCo2XamKlhbrsQ",
  authDomain: "cammmm-3ab96.firebaseapp.com",
  databaseURL: "https://cammmm-3ab96-default-rtdb.firebaseio.com",
  projectId: "cammmm-3ab96",
  storageBucket: "cammmm-3ab96.firebasestorage.app",
  messagingSenderId: "840440488764",
  appId: "1:840440488764:web:4e73de5708f1eac46b3439"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun.relay.metered.ca:80" },
    { urls: "turn:global.relay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
    { urls: "turn:global.relay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
    { urls: "turn:global.relay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
  ]
};

const statusEl = document.getElementById('status');
let roomId = new URLSearchParams(location.search).get('room');
let roomRef = roomId ? db.ref('rooms/' + roomId) : null;
let pc;
let mediaStream = null; // scan + streaming duitatei ei stream reuse hobe

// Room already URL e thakle direct Start button dekhao
if (roomId) {
  statusEl.textContent = 'Room paoya gelo: ' + roomId;
  document.getElementById('scanBtn').style.display = 'none';
  document.getElementById('startBtn').style.display = 'inline-block';
}

async function ensureCameraStream() {
  if (mediaStream) return mediaStream;
  mediaStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  return mediaStream;
}

// ==== QR SCAN FLOW ====
async function startScan() {
  statusEl.textContent = 'Camera khulchi...';
  document.getElementById('entryButtons').style.display = 'none';

  try {
    const stream = await ensureCameraStream();
    const scanVideo = document.getElementById('scanVideo');
    scanVideo.srcObject = stream;
    document.getElementById('scanBox').style.display = 'block';
    statusEl.textContent = 'QR code er dike camera dhoro';

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let scanning = true;

    function tick() {
      if (!scanning) return;
      if (scanVideo.readyState === scanVideo.HAVE_ENOUGH_DATA) {
        canvas.width = scanVideo.videoWidth;
        canvas.height = scanVideo.videoHeight;
        ctx.drawImage(scanVideo, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code && code.data) {
          scanning = false;
          onQrDetected(code.data);
          return;
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  } catch (err) {
    statusEl.textContent = 'Camera permission deoya lagbe: ' + err.message;
    document.getElementById('entryButtons').style.display = 'block';
  }
}

function onQrDetected(text) {
  let scannedRoom = null;
  try {
    const url = new URL(text);
    scannedRoom = url.searchParams.get('room');
  } catch (e) {
    scannedRoom = text.trim(); // QR e shudhu room code thakleo cholbe
  }

  if (!scannedRoom) {
    statusEl.textContent = 'QR e room code paoya jayni, abar try koro';
    document.getElementById('entryButtons').style.display = 'block';
    document.getElementById('scanBox').style.display = 'none';
    return;
  }

  roomId = scannedRoom;
  roomRef = db.ref('rooms/' + roomId);
  document.getElementById('scanBox').style.display = 'none';
  statusEl.textContent = 'Room paoya gelo: ' + roomId;
  start(); // already khola stream diye direct streaming shuru
}

// ==== STREAMING FLOW ====
async function start() {
  document.getElementById('entryButtons').style.display = 'none';
  statusEl.innerHTML = 'Connecting...';

  try {
    const stream = await ensureCameraStream();
    document.getElementById('localVideo').srcObject = stream;

    pc = new RTCPeerConnection(rtcConfig);
    stream.getTracks().forEach(track => pc.addTrack(track, stream));

    pc.onicecandidate = (event) => {
      if (event.candidate) {
        roomRef.child('callerCandidates').push(event.candidate.toJSON());
      }
    };

    pc.onconnectionstatechange = () => {
      console.log('[CAM] connectionState:', pc.connectionState);
      if (pc.connectionState === 'connected') {
        statusEl.innerHTML = '<span id="pulse"></span> LIVE - Admin dekhche';
        statusEl.classList.add('live');
      } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
        statusEl.textContent = 'Disconnected';
        statusEl.classList.remove('live');
      }
    };

    pc.oniceconnectionstatechange = () => {
      console.log('[CAM] iceConnectionState:', pc.iceConnectionState);
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await roomRef.child('offer').set({ type: offer.type, sdp: offer.sdp });

    roomRef.child('answer').on('value', async (snap) => {
      const answer = snap.val();
      if (answer && !pc.currentRemoteDescription) {
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
      }
    });

    roomRef.child('calleeCandidates').on('child_added', (snap) => {
      pc.addIceCandidate(new RTCIceCandidate(snap.val()));
    });

    statusEl.textContent = 'Connecting to admin...';
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
    document.getElementById('entryButtons').style.display = 'block';
  }
}

// Screen off/lock hole stream bondho hote pare — wake lock try
if ('wakeLock' in navigator) {
  navigator.wakeLock.request('screen').catch(() => {});
}
</script>
</body>
</html>
